name: Keep-alive

# 防止 Supabase 免费版项目自动暂停（连续 7 天无 API 活动即触发）：
# 暂停后项目 DNS 下线，线上登录直接报 Failed to fetch，需手动到 Dashboard Resume。
# 因此每天定时请求一次 API 网关，让项目始终保持 Active。
# 注意：仓库若连续 60 天无任何提交，GitHub 会自动停用定时任务，长期不开发时留意 Actions 通知。
on:
  schedule:
    - cron: '0 1 * * *' # 每天 UTC 01:00（北京时间 09:00）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::缺少 VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY secrets（与 Pages 部署共用），无法保活"
            exit 1
          fi

          # secrets 手工粘贴可能带换行/空格：浏览器与 Vite 构建都会容忍，curl 不容忍（URL rejected 瞬间失败），统一裁剪
          SUPABASE_URL="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')"
          SUPABASE_ANON_KEY="$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')"
          # URL 随前端 bundle 本来就公开，打印主机便于排查；anon key 不打印
          echo "目标端点: $(printf '%s' "$SUPABASE_URL" | sed -E 's#^(https?://[^/]+).*$#\1#')"

          # 1) 携带 anon key 的 /rest/v1/：保活关键路径，该请求本身即计入 API 活动
          status=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/" || echo "000")
          if [ "$status" != "200" ] && [ "$status" != "404" ]; then
            echo "::error::REST 网关返回 HTTP $status（000=请求未发出，常见于 secret 值异常或 DNS 失败；5xx=后端异常，项目可能已被自动暂停）。请到 Supabase Dashboard 确认项目状态，必要时点 Resume 后重跑本任务。"
            exit 1
          fi
          echo "✅ REST 网关链路正常（HTTP $status）——今日活动量已计入，项目不会被自动暂停"

          # 2) /auth/v1/health：诊断用，不作为成败判据
          if curl -sf --max-time 30 "$SUPABASE_URL/auth/v1/health" >/dev/null; then
            echo "✅ /auth/v1/health 正常"
          else
            echo "::warning::/auth/v1/health 未通过（不影响保活判定，仅供排查参考）"
          fi
